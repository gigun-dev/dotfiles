---
- name: Apply explicitly transferred mini macOS targets
  hosts: mini_macos
  gather_facts: false
  become: false
  environment:
    HOMEBREW_NO_AUTO_UPDATE: '1'
    HOMEBREW_NO_ANALYTICS: '1'
  pre_tasks:
    - name: Validate host and requested transfer
      ansible.builtin.import_tasks: tasks/preflight.yml
  tasks:
    - name: Select adopted policy-declared CLI executables only
      ansible.builtin.include_tasks: tasks/select_tool.yml
      loop: "{{ mini_targets | select('in', mini_tool_policy.keys() | list) | list }}"
      loop_control:
        loop_var: mini_tool_name
        label: "{{ mini_tool_name }}"
    - name: Distribute explicitly selected signing tools
      ansible.builtin.include_tasks: tasks/signing_tools.yml
      when: "'signing_tools' in mini_targets"
    - name: Manage shell links
      ansible.builtin.include_tasks: tasks/shell.yml
      when: "'shell' in mini_targets"
    - name: Ensure explicitly transferred formulae are present without upgrading
      ansible.builtin.include_tasks: tasks/packages.yml
      when: "'formulae' in mini_targets"
    - name: Manage selected user defaults
      ansible.builtin.include_tasks: tasks/defaults.yml
      when: "'defaults' in mini_targets"
    - name: Start mini-vm at boot from a LaunchDaemon
      ansible.builtin.include_tasks: tasks/lima_daemon.yml
      when: "'lima_daemon' in mini_targets"
    - name: Stage launchd candidates without activating them
      ansible.builtin.include_tasks: tasks/launchd.yml
      when: "'launchd_stage' in mini_targets"
