---
- name: Inspect the approved ripgrep binary
  ansible.builtin.stat:
    path: "{{ mini_ripgrep_source }}"
    checksum_algorithm: sha256
    follow: false
  register: mini_ripgrep_binary
- name: Require the verified executable before selecting it
  ansible.builtin.assert:
    that:
      - mini_ripgrep_binary.stat.isreg | default(false)
      - mini_ripgrep_binary.stat.executable | default(false)
      - mini_ripgrep_binary.stat.checksum | default('') == mini_ripgrep_sha256
- name: Inspect the existing ripgrep selection
  ansible.builtin.stat:
    path: "{{ mini_ripgrep_destination }}"
    follow: false
  register: mini_ripgrep_selection
- name: Preserve unknown files and links
  ansible.builtin.assert:
    that:
      - >-
        not mini_ripgrep_selection.stat.exists or
        (mini_ripgrep_selection.stat.islnk | default(false) and
        mini_ripgrep_selection.stat.lnk_target == mini_ripgrep_source)
    fail_msg: Preserve the existing ripgrep selection and review its ownership before applying.
- name: Select only ripgrep without changing PATH or other Homebrew links
  ansible.builtin.file:
    src: "{{ mini_ripgrep_source }}"
    dest: "{{ mini_ripgrep_destination }}"
    state: link
    force: false
    follow: false
