---
- name: Require existing Homebrew without bootstrapping it
  ansible.builtin.stat:
    path: /usr/local/bin/brew
  register: mini_brew
- name: Validate package boundary
  ansible.builtin.assert:
    that:
      - mini_brew.stat.exists
      - mini_formulae | difference(['lima', 'xcodegen', 'mo']) | length == 0
      - mini_formulae | difference(mini_formula_policy.keys()) | length == 0
      - mini_formulae | difference(mini_ansible_formulae) | length == 0
      - mini_casks | length == 0
    fail_msg: Homebrew remains manual; only individually transferred formulae may be managed here.
  vars:
    mini_ansible_formulae: >-
      {{ mini_formula_policy | dict2items | selectattr('value.owner', 'equalto', 'ansible')
      | map(attribute='key') | list }}
- name: Ensure owned formulae are present
  community.general.homebrew:
    name: "{{ mini_formulae }}"
    path: /usr/local/bin
    state: present
    update_homebrew: false
    upgrade_all: false
  when: mini_formulae | length > 0
