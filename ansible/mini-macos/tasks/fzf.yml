---
- name: Inspect the approved fzf binary
  ansible.builtin.stat:
    path: "{{ mini_fzf_source }}"
    checksum_algorithm: sha256
    follow: false
  register: mini_fzf_binary
- name: Require the verified executable before selecting it
  ansible.builtin.assert:
    that:
      - mini_fzf_binary.stat.isreg | default(false)
      - mini_fzf_binary.stat.executable | default(false)
      - mini_fzf_binary.stat.checksum | default('') == mini_fzf_sha256
- name: Inspect the existing fzf selection
  ansible.builtin.stat:
    path: "{{ mini_fzf_destination }}"
    follow: false
  register: mini_fzf_selection
- name: Preserve unknown files and links
  ansible.builtin.assert:
    that:
      - not mini_fzf_selection.stat.exists or (mini_fzf_selection.stat.islnk | default(false) and mini_fzf_selection.stat.lnk_target == mini_fzf_source)
    fail_msg: Preserve the existing fzf selection and review its ownership before applying.
- name: Select only fzf without changing PATH or other Homebrew links
  ansible.builtin.file:
    src: "{{ mini_fzf_source }}"
    dest: "{{ mini_fzf_destination }}"
    state: link
    force: false
    follow: false
