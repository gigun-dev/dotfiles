---
- name: Read mini migration state without credentials or broad facts
  hosts: mini_macos
  gather_facts: false
  become: false
  environment:
    HOMEBREW_NO_AUTO_UPDATE: '1'
    HOMEBREW_NO_ANALYTICS: '1'
  tasks:
    - name: Validate inventory and host
      ansible.builtin.import_tasks: tasks/preflight.yml
    - name: Read package names and selected defaults
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [/usr/local/bin/brew, list, --formula]
        - [/usr/local/bin/brew, list, --cask]
        - [/usr/bin/defaults, read, com.apple.dock, autohide]
        - [/usr/bin/defaults, read, NSGlobalDomain, KeyRepeat]
        - [/bin/launchctl, list, dev.gigun.net-watchdog]
      register: mini_audit
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Show selected audit results including command failure
      ansible.builtin.debug:
        msg: "{{ item.item }} rc={{ item.rc }} stdout={{ item.stdout }} stderr={{ item.stderr }}"
      loop: "{{ mini_audit.results }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Read user link and generation metadata
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - '{{ mini_home }}/.zshenv'
        - '{{ mini_home }}/.zshrc'
        - '{{ mini_home }}/.zprofile'
        - /run/current-system
      register: mini_audit_links
    - name: Show only path ownership metadata
      ansible.builtin.debug:
        msg: "{{ item.item }} exists={{ item.stat.exists }} link={{ item.stat.lnk_source | default('none') }}"
      loop: "{{ mini_audit_links.results }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Audit Nix references without exposing source values
      ansible.builtin.script: "scripts/audit_nix_refs.py --home {{ mini_home }}"
      args:
        executable: /usr/bin/python3
      register: mini_nix_ref_audit
      changed_when: false
      check_mode: false
    - name: Select the structured sanitized audit result
      ansible.builtin.set_fact:
        mini_nix_ref_audit_lines: >-
          {{ mini_nix_ref_audit.stdout_lines
             | select('match', '^MINI_NIX_REF_AUDIT=')
             | list }}
    - name: Require a structured sanitized audit result
      ansible.builtin.assert:
        that:
          - mini_nix_ref_audit_lines | length == 1
        fail_msg: Nix reference audit returned no structured result.
    - name: Decode the structured sanitized audit result
      ansible.builtin.set_fact:
        mini_nix_ref_audit_report: >-
          {{ mini_nix_ref_audit_lines[0]
             | regex_replace('^MINI_NIX_REF_AUDIT=', '')
             | from_json }}
    - name: Show sanitized Nix reference locations
      ansible.builtin.debug:
        msg: "{{ mini_nix_ref_audit_report }}"
