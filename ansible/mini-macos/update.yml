---
- name: Update explicitly selected declared formulae separately from normal apply
  hosts: mini_macos
  gather_facts: false
  become: false
  environment:
    HOMEBREW_NO_AUTO_UPDATE: '1'
    HOMEBREW_NO_ANALYTICS: '1'
  pre_tasks:
    - name: Check update request
      ansible.builtin.import_tasks: tasks/validate_update.yml
    - name: Validate host and ownership
      ansible.builtin.import_tasks: tasks/preflight.yml
  tasks:
    - name: Update only selected formulae using existing Homebrew metadata
      community.general.homebrew:
        name: "{{ mini_update_formulae }}"
        path: "{{ mini_brew_bin }}"
        state: latest
        update_homebrew: false
        upgrade_all: false
