---
mini_controller_repo: "{{ playbook_dir }}/../.."
mini_home: /Users/gigun
mini_repo: /Users/gigun/ghq/github.com/gigun-dev/dotfiles
# No target is transferred merely by running a playbook.
mini_targets: []
mini_apply_ack: false
mini_update_ack: false
mini_owners:
  shell: ansible
  packages: manual
  defaults: ansible
  launchd: manual
mini_shell_links:
  - {src: zsh/.zshenv, dest: .zshenv}
  - {src: zsh/.zshrc, dest: .zshrc}
  - {src: sheldon, dest: .config/sheldon}
  - {src: zeno, dest: .config/zeno}
  - {src: zsh/functions, dest: .config/zsh/functions}
# Existing formulae only; network/auth tools remain outside this migration.
mini_formulae: [lima, xcodegen, mo]
mini_casks: []
mini_update_formulae: []
mini_update_casks: []
mini_defaults:
  - {domain: com.apple.dock, key: autohide, type: bool, value: true}
  - {domain: NSGlobalDomain, key: KeyRepeat, type: int, value: 2}
mini_stage_dir: /Users/gigun/Library/Application Support/dotfiles-migration/network-watchdog
# Tool targets are policy metadata; adoption records the current owner separately.
# Structural allowlist only; adoption must separately verify the real filesystem protections.
mini_service_destination_allowlist_regex: '\A(?![\s\S]*(?:^|/)\.{1,2}(?:/|\Z))(?![\s\S]*[\x00-\x1f\x7f])(?:/nix/store/[^/]+(?:/[^/]+)*|/run/current-system/sw/bin/[^/]+|/Library/PrivilegedHelperTools/[^/]+)\Z'
mini_tool_policy:
  fzf:
    target:
      version: "0.74.5"
      source:
        kind: homebrew_cellar
        formula: fzf
        path: /usr/local/Cellar/fzf/0.74.5/bin/fzf
        integrity: {kind: executable_sha256, sha256: ba4b0df70d7fd9e8dd0d2fa479d68c2bc10859449c86e6f7e2d1856d663d1111}
        artifact: {kind: private_release_bottle_sha256, sha256: 45957f1abe8b2c450629c09c3ed9afa31feb8bc16935417949b387f53249e689}
      selection:
        mode: interactive_cli
        state: selected
        destination: /usr/local/bin/fzf
        accepted_existing: [/usr/local/Cellar/fzf/0.74.5/bin/fzf]
        force: false
      update_policy: manual
    adoption: {state: adopted, owner: ansible}
  zoxide:
    target:
      version: "0.10.0"
      source:
        kind: homebrew_cellar
        formula: zoxide
        path: /usr/local/Cellar/zoxide/0.10.0/bin/zoxide
