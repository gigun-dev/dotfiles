        force: false
      update_policy: manual
    adoption: {state: adopted, owner: ansible}
  ripgrep:
    target:
      version: "15.2.0"
      source:
        kind: homebrew_cellar
        formula: ripgrep
        path: /usr/local/Cellar/ripgrep/15.2.0/bin/rg
        integrity: {kind: executable_sha256, sha256: f8cf484393a97aaaa4ce35df1c5ea2790f6b8af6d86c8d31b3e694369dc5ebb4}
        artifact: {kind: homebrew_bottle_sha256, platform: sonoma, sha256: 9dd76bad725daf9ad1d4c983419e79ec92aefdae0cc9c92d465b424c8aea4808}
