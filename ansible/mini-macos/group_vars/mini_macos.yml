---
mini_controller_repo: "{{ playbook_dir }}/../.."
mini_home: /Users/gigun
mini_repo: /Users/gigun/ghq/github.com/gigun-dev/dotfiles
# No target is transferred merely by running a playbook.
mini_targets: []
mini_apply_ack: false
mini_update_ack: false
mini_owners:
  zoxide: ansible
  fzf: ansible
  ripgrep: ansible
  xcodegen: ansible
  shell: ansible
  packages: manual
  defaults: ansible
  launchd: manual
mini_shell_links:
  - {src: zsh/.zshenv, dest: .zshenv}
  - {src: zsh/.zshrc, dest: .zshrc}
  - {src: sheldon, dest: .config/sheldon}
  - {src: zeno, dest: .config/zeno}
  - {src: zsh/functions, dest: .config/zsh/functions}
# Existing formulae only; network/auth tools remain outside this migration.
mini_formulae: [lima, xcodegen, mo]
mini_casks: []
mini_update_formulae: []
mini_update_casks: []
mini_defaults:
  - {domain: com.apple.dock, key: autohide, type: bool, value: true}
  - {domain: NSGlobalDomain, key: KeyRepeat, type: int, value: 2}
mini_stage_dir: /Users/gigun/Library/Application Support/dotfiles-migration/network-watchdog
# Exact binary from the validated private Release; package installation is separate.
mini_fzf_source: /usr/local/Cellar/fzf/0.74.5/bin/fzf
mini_fzf_destination: /usr/local/bin/fzf
mini_fzf_sha256: ba4b0df70d7fd9e8dd0d2fa479d68c2bc10859449c86e6f7e2d1856d663d1111
# Official Homebrew 0.10.0 Intel Sonoma bottle, installed with --skip-link.
mini_zoxide_source: /usr/local/Cellar/zoxide/0.10.0/bin/zoxide
mini_zoxide_destination: /usr/local/bin/zoxide
mini_zoxide_sha256: e376d3046098c87fa25ed385bb4d1bc1e72c2c8b88f919ddaf912a19f6442a9f
# Exact Homebrew 15.2.0 Intel executable validated on mini; package installation is separate.
mini_ripgrep_source: /usr/local/Cellar/ripgrep/15.2.0/bin/rg
mini_ripgrep_destination: /usr/local/bin/rg
mini_ripgrep_sha256: f8cf484393a97aaaa4ce35df1c5ea2790f6b8af6d86c8d31b3e694369dc5ebb4
# Existing Homebrew core XcodeGen 2.46.0 Intel bottle; package install/update stays manual.
mini_xcodegen_source: /usr/local/Cellar/xcodegen/2.46.0/bin/xcodegen
mini_xcodegen_destination: /usr/local/bin/xcodegen
mini_xcodegen_sha256: b8714a29ed5d40319ff8a653e08fa684c756deee1ff0db15cac66b6392a55ba3
# The only accepted pre-migration Homebrew link; other files or links are preserved.
mini_xcodegen_legacy_link_target: ../Cellar/xcodegen/2.46.0/bin/xcodegen
