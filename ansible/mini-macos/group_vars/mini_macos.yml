    url: https://github.com/nushell/nushell/releases/download/0.116.1/nu-0.116.1-x86_64-apple-darwin.tar.gz
    sha256: 44306f0766f2be0e763d0c7a6a6774537589a335797a199d8e5b473d766ec6bd
