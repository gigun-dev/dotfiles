[project]
name = "dotfiles-mini-ansible"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["ansible>=12,<13", "ansible-lint>=25,<26"]

[tool.uv]
package = false

# Match the repository's anonymous Guard index on clean CI controllers too.
[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true
