history:
  defaultScope: global
  fzfCommand: fzf
  fzfOptions:
    - "--tmux"
    - "80%"
  keymap:
    deleteSoft: ctrl-d
    deleteHard: alt-d
    toggleScope: ctrl-r

snippets:
  - keyword: v
    snippet: nvim

  - keyword: gg
    snippet: ghq get

  - keyword: gca
    snippet: git commit -m "$(git diff --cached | claude -p 'この差分に対する簡潔なコミットメッセージを1行で書いて。メッセージ本文のみ出力して')"

  - keyword: ngc
    snippet: nix-collect-garbage -d

  # agent-browser は CLI フラグの組み合わせで daemon fingerprint が変わり別 daemon が
  # 起動する。--profile/--headed を毎回付けるのは面倒なので user config
  # (~/.agent-browser/config.json → dotfiles/agent-browser/config.json) に
  # "headed": true, "profile": "Default" を書いて、snippet は plain に保つ。
  - keyword: abo
    snippet: agent-browser open

  - keyword: abt
    snippet: agent-browser tab

  - keyword: abs
    snippet: agent-browser snapshot --compact

  - keyword: abc
    snippet: agent-browser close --all

# zeno は patterns を YAML 先頭から first-match で評価する。
# 第 2 階層のパターンを top-level より先に置くことで shadow を防ぐ。
# パターンは `^agent-browser( \S+)* <sub> $` 形式 — 任意個のフラグ/前置トークンを許容しつつ、
# 末尾サブコマンドにアンカーを掛ける。`(.* )?` 方式は trailing-space と literal-leading-space が
# 1 文字を取り合って `--cdp 9222 sub ` で破綻するため避ける。
completions:
  # ----- 第 2 階層 (具体パターン優先) -----

  # skills get <name>  ← `get` より先に置かないと shadow される
  - name: agent-browser skills get
    patterns:
      - "^agent-browser( \\S+)* skills get $"
    sourceCommand: "printf '%s\\n' core electron slack agentcore vercel-sandbox dogfood"
    options: { --tmux: "80%", --prompt: "'skill> '" }

  # get <what>
  - name: agent-browser get
    patterns:
      - "^agent-browser( \\S+)* get $"
    sourceCommand: "printf '%s\\n' text html value attr title url count box styles cdp-url"
    options: { --tmux: "80%", --prompt: "'get> '" }

  # is <what>
  - name: agent-browser is
    patterns:
      - "^agent-browser( \\S+)* is $"
    sourceCommand: "printf '%s\\n' visible enabled checked"
    options: { --tmux: "80%", --prompt: "'is> '" }

  # find <locator>
  - name: agent-browser find
    patterns:
      - "^agent-browser( \\S+)* find $"
    sourceCommand: "printf '%s\\n' role text label placeholder alt title testid first last nth"
    options: { --tmux: "80%", --prompt: "'find> '" }

  # mouse <action>
  - name: agent-browser mouse
    patterns:
      - "^agent-browser( \\S+)* mouse $"
    sourceCommand: "printf '%s\\n' move down up wheel"
    options: { --tmux: "80%", --prompt: "'mouse> '" }

  # set <setting>
  - name: agent-browser set
    patterns:
      - "^agent-browser( \\S+)* set $"
    sourceCommand: "printf '%s\\n' viewport device geo offline headers credentials media"
    options: { --tmux: "80%", --prompt: "'set> '" }

  # network <action>
  - name: agent-browser network
    patterns:
      - "^agent-browser( \\S+)* network $"
    sourceCommand: "printf '%s\\n' route unroute requests har"
    options: { --tmux: "80%", --prompt: "'network> '" }

  # cookies <op>
  - name: agent-browser cookies
    patterns:
      - "^agent-browser( \\S+)* cookies $"
    sourceCommand: "printf '%s\\n' get set clear"
    options: { --tmux: "80%", --prompt: "'cookies> '" }

  # storage <kind>
  - name: agent-browser storage
    patterns:
      - "^agent-browser( \\S+)* storage $"
    sourceCommand: "printf '%s\\n' local session"
    options: { --tmux: "80%", --prompt: "'storage> '" }

  # tab <action>
  - name: agent-browser tab
    patterns:
      - "^agent-browser( \\S+)* tab $"
    sourceCommand: "printf '%s\\n' new list close"
    options: { --tmux: "80%", --prompt: "'tab> '" }

  # keyboard <action>
  - name: agent-browser keyboard
    patterns:
      - "^agent-browser( \\S+)* keyboard $"
    sourceCommand: "printf '%s\\n' type inserttext"
    options: { --tmux: "80%", --prompt: "'keyboard> '" }

  # scroll <dir>
  - name: agent-browser scroll
    patterns:
      - "^agent-browser( \\S+)* scroll $"
    sourceCommand: "printf '%s\\n' up down left right"
    options: { --tmux: "80%", --prompt: "'scroll> '" }

  # diff <kind>
  - name: agent-browser diff
    patterns:
      - "^agent-browser( \\S+)* diff $"
    sourceCommand: "printf '%s\\n' snapshot screenshot url"
    options: { --tmux: "80%", --prompt: "'diff> '" }

  # trace / profiler / record — start|stop
  - name: agent-browser start-stop
    patterns:
      - "^agent-browser( \\S+)* (trace|profiler|record) $"
    sourceCommand: "printf '%s\\n' start stop"
    options: { --tmux: "80%" }

  # stream
  - name: agent-browser stream
    patterns:
      - "^agent-browser( \\S+)* stream $"
    sourceCommand: "printf '%s\\n' enable disable status"
    options: { --tmux: "80%", --prompt: "'stream> '" }

  # clipboard <op>
  - name: agent-browser clipboard
    patterns:
      - "^agent-browser( \\S+)* clipboard $"
    sourceCommand: "printf '%s\\n' read write copy paste"
    options: { --tmux: "80%", --prompt: "'clipboard> '" }

  # auth <op>
  - name: agent-browser auth
    patterns:
      - "^agent-browser( \\S+)* auth $"
    sourceCommand: "printf '%s\\n' save login list show delete"
    options: { --tmux: "80%", --prompt: "'auth> '" }

  # session <op>
  - name: agent-browser session
    patterns:
      - "^agent-browser( \\S+)* session $"
    sourceCommand: "printf '%s\\n' list"
    options: { --tmux: "80%" }

  # dashboard <op>
  - name: agent-browser dashboard
    patterns:
      - "^agent-browser( \\S+)* dashboard $"
    sourceCommand: "printf '%s\\n' start stop"
    options: { --tmux: "80%" }

  # skills <op>
  - name: agent-browser skills
    patterns:
      - "^agent-browser( \\S+)* skills $"
    sourceCommand: "printf '%s\\n' list get path"
    options: { --tmux: "80%", --prompt: "'skills> '" }

  # provider value for -p/--provider
  - name: agent-browser provider
    patterns:
      - "^agent-browser( \\S+)* (-p|--provider) $"
    sourceCommand: "printf '%s\\n' ios browserbase kernel browseruse browserless agentcore"
    options: { --tmux: "80%", --prompt: "'provider> '" }

  # ----- top-level (最後 — 第 2 階層が match しなかった時の fallback) -----
  # 注意 1: zeno widget プロトコルは行ベース ($(f) split) で各フィールド 1 行前提。
  # multi-line sourceCommand (YAML `|`) は array index が崩れて最初の 1 行だけ
  # source_command に入り fzf が空になる。必ず 1 行で書くこと。
  # 注意 2: pattern は subcommand 未入力時のみ match させる。
  # `( \S+)*` だと `agent-browser snapshot --compact <Tab>` でも top-level が
  # 発火してサブコマンド一覧が出てしまう。flag/flag-value トークンに限定する。
  - name: agent-browser command
    patterns:
      # `agent-browser ` (no args) または flag のみ ( --headed / --cdp 9222 / --profile X /
      # --key=val 等) で末尾 space。positional 名詞 (snapshot 等) が居ると match しない。
      - "^agent-browser( +(--?[\\w-]+(=\\S+)?|\\d+|/\\S+))* +$"
    sourceCommand: 'printf "%s\t%s\n" open "Navigate to URL" click "Click element (or @ref)" dblclick "Double-click element" type "Type into element" fill "Clear and fill" press "Press key" keyboard "Real keystrokes (no selector)" hover "Hover element" focus "Focus element" check "Check checkbox" uncheck "Uncheck checkbox" select "Select dropdown option" drag "Drag and drop" upload "Upload files" download "Download by click" scroll "Scroll dir" scrollintoview "Scroll element into view" wait "Wait for element or time" screenshot "Take screenshot" pdf "Save as PDF" snapshot "Accessibility tree (for AI)" eval "Run JavaScript" connect "Connect via CDP" close "Close browser" back "Go back" forward "Go forward" reload "Reload page" get "Get info (text/html/...)" is "Check state (visible/...)" find "Find by role/text/..." mouse "Mouse actions" set "Browser settings" network "Network control" cookies "Manage cookies" storage "Web storage" tab "Manage tabs" diff "Compare snapshots" trace "DevTools trace" profiler "DevTools profile" record "Video recording" console "View console logs" errors "View page errors" highlight "Highlight element" inspect "Open DevTools" clipboard "Read/write clipboard" stream "WebSocket streaming" batch "Execute multiple commands" auth "Auth vault" confirm "Approve pending" deny "Deny pending" session "Session info" chat "AI chat" dashboard "Observability dashboard" skills "Show skills" install "Install browser binaries" upgrade "Upgrade to latest" doctor "Diagnose install" profiles "List Chrome profiles"'
    options:
      --tmux: "80%"
      --prompt: "'agent-browser> '"
      --header: "'agent-browser subcommand'"
    callback: "awk '{print $1}'"
