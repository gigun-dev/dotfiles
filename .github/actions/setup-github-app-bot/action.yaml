name: Setup GitHub App bot
description: Issue a repository-scoped installation token and configure its bot identity

inputs:
  app-id:
    description: GitHub App ID
    required: true
  private-key:
    description: GitHub App private key
    required: true

outputs:
  token:
    description: Short-lived installation token for the current repository
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Issue repository-scoped installation token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write

    - name: Configure App bot identity
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        bot_id=$(gh api "users/${APP_SLUG}[bot]" --jq '.id')
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

    - name: Configure ephemeral Git HTTPS authentication
      shell: bash
      run: |
        set -euo pipefail
        askpass="$RUNNER_TEMP/github-app-askpass"
        cat >"$askpass" <<'EOF'
        #!/usr/bin/env bash
        case "$1" in
          *Username*) printf '%s\n' x-access-token ;;
          *Password*) printf '%s\n' "$GH_TOKEN" ;;
          *) exit 1 ;;
        esac
        EOF
        chmod 700 "$askpass"
