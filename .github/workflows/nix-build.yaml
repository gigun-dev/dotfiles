name: 'CI: Nix check'

# 何を守るか: main に入る前に「eval が通る」「フォーマット済み」「**実際にビルドできる**」を確認する。
#
# ビルドまで見るのは、この CI が無人機へ届く変更の**ゲート**だから。lock 自動更新 PR の
# merge 条件であり、mini-vm の dotfiles-autoswitch も main の HEAD のこの check run が
# green のときだけ適用する (手元の pre-push 関門は撤去済み。docs/adr/0011-*)。
# eval だけ通る lock を通すと、初回ビルドの失敗が 04:00 の VM 上で起きることになる。
# job 名 (check / build) は branch protection の required checks と mini-vm.nix の
# requiredChecksJson が名指ししているので、改名するときは 3 か所を揃える。
#
# **外部 action は commit SHA で固定する**。タグは書き換えられるので、上流が乗っ取られると
# 任意のコードが CI で走る。いまこの workflow は secrets を 1 つも使わず token も read-only
# なので実害は小さいが、盗るものが無いことに依存した安全は脆い。
# 版を上げるときは `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` で SHA を引き直すこと。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# repository は read-only。成功した main の Nix store だけ Actions cache に保存する。
# lock 更新の PR は mini-vm が出す。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ${{ fromJSON(vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-slim"]') }}
    permissions:
      contents: read
      # paths-filter は PR の変更ファイルを REST API で取得する。
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # ここに無いパスだけの commit では check/build が skipped になり、mini-vm の
          # autoswitch はそれを green として適用する。nix の評価が読むファイル
          # (mini-vm.nix の ../../../ 参照) は漏らさず挙げる。
          filters: |
            nix:
              - 'ci/linux-runner/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'infra/langfuse/**'
              - 'secrets/**'
              - 'scripts/**'
              - 'bootstrap.sh'
              - 'zsh/**'
              - 'npm/**'
              - 'bun/**'
              - 'pip/**'
              - 'uv/**'
              - '.github/workflows/nix-build.yaml'
              - '.github/actions/setup-nix/**'
              - '.github/actions/check-linux-runner/**'

  check:
    needs: changes
    if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only this job's client accepts flake config; the daemon's policy is unchanged.
      - name: Configure reviewed runner Nix client
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          printf 'NIX_CONFIG<<EOF\naccept-flake-config = true\nEOF\n' >> "$GITHUB_ENV"
      - uses: ./.github/actions/check-linux-runner
        if: ${{ runner.environment == 'self-hosted' }}
      - uses: ./.github/actions/setup-nix
        if: ${{ runner.environment != 'self-hosted' }}

      # `--no-build` を付けないこと。ESP-IDF の devShell は
      # `builtins.readFile "${src}/tools/tools.json"` でソースを読む (IFD) ため、
      # 評価に fetch が要る。`--no-build` だとそれが禁じられ
      # `error: path '...-source.drv' is not valid` で必ず落ちる。
      # 2026-09-05 に esp-idf の devShell が入って以降、CI はずっとこれで赤だった
      # (nix を触らない PR では paths-filter に弾かれて job 自体が走らず、
      #  赤いことに気づけなかった)。
      # 検証の中身は scripts/verify.sh に置き、手元でも同じものを叩けるようにする。
      - name: Report isolated NixOS test acceleration
        run: |
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'KVM is available for the isolated NixOS lifecycle test.'
          else
            echo 'KVM is unavailable; the lifecycle test is not validated on this runner.'
          fi

      - name: Nix flake and fmt check
        run: sh scripts/verify.sh

  # ビルドするのは x86_64-linux だけ。**無人で適用されるのがそこだけ**だから。
  # M4 Pro (aarch64-darwin) は人が前に座って switch するので失敗はその場で見えるし、
  # x86_64-darwin は nix 管理を凍結済みで switch しない (CLAUDE.md 参照)。
  #
  # substituter は flake.nix の nixConfig にあるものを使う。llm-agents / cclens は
  # あえて nixpkgs.follows を付けていないので、上流の専用 cachix に直ヒットして
  # ほぼダウンロードだけで済む (follows を付けると自前 nixpkgs でリビルドされ、
  # ここが Rust のフルビルドになって時間切れする)。
  build:
    needs: changes
    if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only this job's client accepts flake config; the daemon's policy is unchanged.
      - name: Configure reviewed runner Nix client
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          printf 'NIX_CONFIG<<EOF\naccept-flake-config = true\nEOF\n' >> "$GITHUB_ENV"
      - uses: ./.github/actions/check-linux-runner
        if: ${{ runner.environment == 'self-hosted' }}
      - uses: ./.github/actions/setup-nix
        if: ${{ runner.environment != 'self-hosted' }}
        # The build cache can take longer to restore than a build using substituters.
        # Keep check's cache; evaluate the build duration again after this change.
        with:
          store-cache: 'false'

      - name: Build mini-vm (NixOS)
        run: nix build --no-link --print-out-paths '.#nixosConfigurations.mini-vm.config.system.build.toplevel'

      - name: Build home (x86_64-linux)
        run: >-
          nix build --no-link --print-out-paths
          '.#homeConfigurations.gigun-x86_64-linux.activationPackage'
          '.#homeConfigurations.gigun-mini-vm.activationPackage'

  macos-regressions:
    needs: changes
    if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-nix
      - name: Build isolated Darwin regression checks
        run: >-
          nix build --no-link --print-build-logs
          .#checks.aarch64-darwin.guard-settings
          .#checks.aarch64-darwin.guard-handoff
          .#checks.aarch64-darwin.setup-routing
          .#checks.aarch64-darwin.switch-routing
          .#checks.aarch64-darwin.zsh-startup
