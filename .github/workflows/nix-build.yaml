name: 'CI: Nix check'

# 何を守るか: main に入る前に「eval が通る」「フォーマット済み」「**実際にビルドできる**」を確認する。
#
# ビルドまで見るのは、この CI が無人機へ届く変更の**ゲート**だから。lock 自動更新 PR の
# merge 条件であり、mini-vm の dotfiles-autoswitch も main の HEAD のこの check run が
# green のときだけ適用する (手元の pre-push 関門は撤去済み。docs/adr/0011-*)。
# eval だけ通る lock を通すと、初回ビルドの失敗が 04:00 の VM 上で起きることになる。
# job 名 nix-ci-gate は branch protection の required check と mini-vm.nix の
# requiredChecksJson が名指しする。check / build は条件付きの実処理で、直接requiredにしない。
#
# macOS ランナー (料金が Linux の 10 倍) はこの workflow に置かない。Darwin の回帰 check は
# macos-regressions.yaml に分け、手動実行だけにしてある。Pro 上では
# `nix build .#checks.aarch64-darwin.<name>` でネイティブに確かめられる (docs/testing.md)。
# push と pull_request の両方で走るのは意図どおり: PR は lock 更新の merge 条件、
# main への push は autoswitch が見る HEAD の check run になる。
#
# **外部 action は commit SHA で固定する**。タグは書き換えられるので、上流が乗っ取られると
# 任意のコードが CI で走る。いまこの workflow は secrets を 1 つも使わず token も read-only
# なので実害は小さいが、盗るものが無いことに依存した安全は脆い。
# 版を上げるときは `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` で SHA を引き直すこと。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# repository は read-only。成功した main の Nix store だけ Actions cache に保存する。
# lock 更新の PR は mini-vm が出す。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ${{ fromJSON(vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-slim"]') }}
    permissions:
      contents: read
      # paths-filter は PR の変更ファイルを REST API で取得する。
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # pushではpaths-filterが直前commitと比較する。credentialを保持して
          # 後からfetchさせず、必要な2 commitsをcheckout時に取得する。
          fetch-depth: 2
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # ここに無いパスだけの commit では check/build が skipped になる。最後のgateは
          # changes=successかつ両方skippedの場合だけgreenにする。nix の評価が読むファイル
          # (mini-vm.nix の ../../../ 参照) は漏らさず挙げる。
          filters: |
            nix:
              - 'ci/linux-runner/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'infra/langfuse/**'
              - 'secrets/**'
              - 'scripts/**'
              - 'bootstrap.sh'
              - 'zsh/**'
              - 'npm/**'
              - 'bun/**'
              - 'pip/**'
              - 'uv/**'
              - '.github/workflows/nix-build.yaml'
              - '.github/actions/setup-nix/**'
              - '.github/actions/check-linux-runner/**'

  # pre-commit only sees staged changes. This independent read-only job also covers
  # bot/API changes and makes the required gate reject an unscanned current tree.
  secret-scan:
    runs-on: ${{ fromJSON(vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure reviewed runner Nix client
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          printf 'NIX_CONFIG<<EOF\naccept-flake-config = true\nmax-jobs = 1\ncores = 2\nEOF\n' >> "$GITHUB_ENV"
      - uses: ./.github/actions/check-linux-runner
        if: ${{ runner.environment == 'self-hosted' }}
      - uses: ./.github/actions/setup-nix
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          store-cache: 'false'
      - name: Scan current tree for secrets
        run: nix run .#gitleaks -- dir . --redact=100 --no-banner
      - name: Lint Actions definitions
        run: nix shell --inputs-from . nixpkgs#actionlint -c actionlint -no-color
      # zizmor recommends the newer $/ syntax for same-repository actions, but the
      # locked actionlint 1.7.12 does not parse it yet. Gate security findings at
      # Medium or above without adding a rule-specific suppression.
      - name: Audit Actions definitions
        run: >-
          nix shell --inputs-from . nixpkgs#zizmor -c zizmor
          --offline --persona regular --min-severity medium
          --strict-collection --format github
          --no-progress --no-config --no-ignores .

  check:
    needs: changes
    if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Only this job's client accepts flake config; the daemon's policy is unchanged.
      - name: Configure reviewed runner Nix client
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          printf 'NIX_CONFIG<<EOF\naccept-flake-config = true\nmax-jobs = 1\ncores = 2\nEOF\n' >> "$GITHUB_ENV"
      - uses: ./.github/actions/check-linux-runner
        if: ${{ runner.environment == 'self-hosted' }}
      - uses: ./.github/actions/setup-nix
        if: ${{ runner.environment != 'self-hosted' }}

      # `--no-build` を付けないこと。ESP-IDF の devShell は
      # `builtins.readFile "${src}/tools/tools.json"` でソースを読む (IFD) ため、
      # 評価に fetch が要る。`--no-build` だとそれが禁じられ
      # `error: path '...-source.drv' is not valid` で必ず落ちる。
      # 2026-09-05 に esp-idf の devShell が入って以降、CI はずっとこれで赤だった
      # (nix を触らない PR では paths-filter に弾かれて job 自体が走らず、
      #  赤いことに気づけなかった)。
      # 検証の中身は scripts/verify.sh に置き、手元でも同じものを叩けるようにする。
      - name: Report isolated NixOS test acceleration
        run: |
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'KVM is available for the isolated NixOS lifecycle test.'
          else
            echo 'KVM is unavailable to the runner; the lifecycle test may run without acceleration.'
          fi

      - name: Nix flake and fmt check
        run: sh scripts/verify.sh

  # ビルドするのは x86_64-linux だけ。**無人で適用されるのがそこだけ**だから。
  # M4 Pro (aarch64-darwin) は人が前に座って switch するので失敗はその場で見えるし、
  # x86_64-darwin は nix 管理を凍結済みで switch しない (CLAUDE.md 参照)。
  #
  # substituter は flake.nix の nixConfig にあるものを使う。llm-agents / cclens は
  # あえて nixpkgs.follows を付けていないので、上流の専用 cachix に直ヒットして
  # ほぼダウンロードだけで済む (follows を付けると自前 nixpkgs でリビルドされ、
  # ここが Rust のフルビルドになって時間切れする)。
  build:
    needs: changes
    if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Only this job's client accepts flake config; the daemon's policy is unchanged.
      - name: Configure reviewed runner Nix client
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          printf 'NIX_CONFIG<<EOF\naccept-flake-config = true\nmax-jobs = 1\ncores = 2\nEOF\n' >> "$GITHUB_ENV"
      - uses: ./.github/actions/check-linux-runner
        if: ${{ runner.environment == 'self-hosted' }}
      - uses: ./.github/actions/setup-nix
        if: ${{ runner.environment != 'self-hosted' }}
        # The build cache can take longer to restore than a build using substituters.
        # Keep check's cache; evaluate the build duration again after this change.
        with:
          store-cache: 'false'

      - name: Build mini-vm (NixOS)
        run: nix build --no-link --print-out-paths '.#nixosConfigurations.mini-vm.config.system.build.toplevel'

      - name: Build home (x86_64-linux)
        run: >-
          nix build --no-link --print-out-paths
          '.#homeConfigurations.gigun-x86_64-linux.activationPackage'
          '.#homeConfigurations.gigun-mini-vm.activationPackage'

  # 条件付きのcheck/buildを直接requiredにすると、changesが失敗して両方skippedになったときに
  # branch protectionを通過できる。必ず実行する1つのgateで依存job全体をfail-closedに畳む。
  nix-ci-gate:
    needs:
      - changes
      - secret-scan
      - check
      - build
    if: ${{ always() }}
    runs-on: ${{ fromJSON(vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-slim"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require a consistent CI result
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_NIX_CHANGED: ${{ needs.changes.outputs.nix }}
          CI_CHANGES_RESULT: ${{ needs.changes.result }}
          CI_CHECK_RESULT: ${{ needs.check.result }}
          CI_BUILD_RESULT: ${{ needs.build.result }}
          CI_SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: sh scripts/ci-required-gate.sh
