name: 'Bot: Propose flake.lock update'

on:
  schedule:
    # GitHub cron is UTC. fast: every day 01:00 JST; slow: Sunday 02:00 JST.
    - cron: '0 16 * * *'
    - cron: '0 17 * * 6'
  workflow_dispatch:
    inputs:
      lane:
        description: Input update lane
        required: true
        type: choice
        options:
          - fast
          - slow

# The default token only reads the checkout. Every write uses the short-lived,
# one-repository GitHub App token issued inside the job.
permissions:
  contents: read

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        lane: ${{ fromJSON(github.event_name == 'schedule' && (github.event.schedule == '0 16 * * *' && '["fast"]' || '["slow"]') || format('["{0}"]', inputs.lane)) }}
    concurrency:
      group: flake-lock-proposal-${{ matrix.lane }}
      cancel-in-progress: false
    environment: github-app-updater
    # Schedule is always GitHub-hosted. The self-hosted escape hatch is only a
    # reviewed, manually dispatched emergency path.
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository for local actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure reviewed runner Nix client
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          printf 'NIX_CONFIG<<EOF\naccept-flake-config = true\nmax-jobs = 1\ncores = 2\nEOF\n' >> "$GITHUB_ENV"

      - uses: ./.github/actions/check-linux-runner
        if: ${{ runner.environment == 'self-hosted' }}

      - uses: ./.github/actions/setup-nix
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          store-cache: 'false'

      - name: Prepare and build candidate
        id: candidate
        run: scripts/ci/propose-flake-lock.sh prepare '${{ matrix.lane }}'

      - name: Configure GitHub App bot
        if: steps.candidate.outputs.changed == 'true'
        id: bot
        uses: ./.github/actions/setup-github-app-bot
        with:
          app-id: ${{ vars.DOTFILES_UPDATER_APP_ID }}
          private-key: ${{ secrets.DOTFILES_UPDATER_APP_PRIVATE_KEY }}

      - name: Publish candidate
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GIT_ASKPASS: ${{ runner.temp }}/github-app-askpass
          GIT_TERMINAL_PROMPT: '0'
        run: scripts/ci/propose-flake-lock.sh publish '${{ matrix.lane }}'
