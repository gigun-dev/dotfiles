name: fzf Intel bottle
on:
  repository_dispatch:
    types: [fzf_candidate]
  workflow_dispatch:
    inputs:
      bounded_trial:
        description: 'Explicit one-time Intel validation (30m build + 10m verify); no schedule or host adoption'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: fzf-intel-bottle
  cancel-in-progress: false
jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-app-updater
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read candidate without executing its code
        if: github.event_name == 'repository_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.client_payload.head_sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Validate candidate boundary
        env:
          EXPECTED_ACTOR: ${{ vars.DOTFILES_UPDATER_BOT_LOGIN }}
          CANDIDATE_BRANCH: ${{ github.event.client_payload.branch }}
          CANDIDATE_HEAD: ${{ github.event.client_payload.head_sha }}
          SOURCE_KEY: ${{ github.event.client_payload.source_key }}
        run: |
          if test "$GITHUB_EVENT_NAME" = repository_dispatch; then
            test "$GITHUB_ACTOR" = "$EXPECTED_ACTOR"
            [[ "$CANDIDATE_BRANCH" =~ ^update/fzf-[0-9a-f]{64}$ ]]
            [[ "$CANDIDATE_HEAD" =~ ^[0-9a-f]{40}$ ]]
            [[ "$SOURCE_KEY" =~ ^[0-9a-f]{64}$ ]]
            test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_HEAD"
            test "$(git -C candidate rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = 2
            test "$(git -C candidate diff-tree --no-commit-id --name-only -r HEAD)" = ci/homebrew-fzf/fzf.lock.json
            cp candidate/ci/homebrew-fzf/fzf.lock.json ci/homebrew-fzf/fzf.lock.json
            python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'ci/homebrew-fzf')
          import state
          lock = state.validate(json.load(open('ci/homebrew-fzf/fzf.lock.json')))
          assert state.sha(state.encoded(state.inputs(lock))) == os.environ['SOURCE_KEY']
          PY
          fi
      - run: |
          bash -n ci/homebrew-fzf/recipe.sh
          python3 -m unittest discover -s ci/homebrew-fzf/tests -v
      - id: policy
        env:
          BOUNDED_TRIAL: ${{ inputs.bounded_trial }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p=json.load(open('ci/homebrew-fzf/policy.json'))
          print('enabled='+str(p['build_enabled'] or os.environ.get('BOUNDED_TRIAL') == 'true').lower())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fzf-candidate-lock
          path: ci/homebrew-fzf/fzf.lock.json
          retention-days: 1
          if-no-files-found: error
  build:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      key: ${{ steps.identity.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fzf-candidate-lock
          path: ci/homebrew-fzf
      - id: identity
        run: |
          bash ci/homebrew-fzf/recipe.sh preflight > "$RUNNER_TEMP/preflight.json"
          python3 -c 'import json,sys; json.dump(json.load(open(sys.argv[1]))["identity"],open(sys.argv[2],"w"))' "$RUNNER_TEMP/preflight.json" "$RUNNER_TEMP/environment.json"
          echo "key=$(python3 ci/homebrew-fzf/state.py key --environment "$RUNNER_TEMP/environment.json")" >> "$GITHUB_OUTPUT"
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KEY: ${{ steps.identity.outputs.key }}
        run: python3 ci/homebrew-fzf/reuse.py "$BUILD_KEY" "$RUNNER_TEMP/reused"
      - if: steps.reuse.outputs.reused != 'true'
        run: |
          bash ci/homebrew-fzf/recipe.sh prepare-ci --execute --disposable-runner
          bash ci/homebrew-fzf/recipe.sh build --work "$RUNNER_TEMP/fzf" --execute --disposable-runner
      - if: steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fzf-build-${{ steps.identity.outputs.key }}
          path: ${{ runner.temp }}/fzf/build/
          retention-days: 14
          if-no-files-found: error
  verify:
    needs: build
    if: needs.build.outputs.reused != 'true'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fzf-candidate-lock
          path: ci/homebrew-fzf
      - env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KEY: ${{ needs.build.outputs.key }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "fzf-build-$BUILD_KEY" --dir "$RUNNER_TEMP/source-build"
      - run: |
          bash ci/homebrew-fzf/recipe.sh prepare-ci --execute --disposable-runner
          bash ci/homebrew-fzf/recipe.sh verify --work "$RUNNER_TEMP/fzf" --artifact "$RUNNER_TEMP/source-build" --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fzf-validated-${{ needs.build.outputs.key }}
          path: ${{ runner.temp }}/fzf/store/${{ needs.build.outputs.key }}/
          retention-days: 14
          if-no-files-found: error
