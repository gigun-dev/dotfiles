name: Detect fzf update
on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST; detection only when unchanged
permissions:
  contents: read
concurrency:
  group: fzf-update-proposal
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # This proposal job pushes its fixed branch; read-only jobs disable persistence.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import json; assert json.load(open("ci/homebrew-fzf/policy.json"))["update_pr_enabled"]'
          python3 ci/homebrew-fzf/state.py detect --output "$RUNNER_TEMP/candidate.json"
          test -f "$RUNNER_TEMP/candidate.json" || exit 0
          python3 ci/homebrew-fzf/update.py "$RUNNER_TEMP/candidate.json"
# actions:write is used only for explicit dispatch: token-created PRs do not
# trigger PR workflows. No reviews, merge, release publication or host apply.
