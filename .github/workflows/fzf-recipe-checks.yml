name: fzf recipe checks
on:
  pull_request:
    paths:
      - 'ci/homebrew-fzf/**'
      - '.github/workflows/fzf-*.yml'
  push:
    branches: [build/fzf-intel-bottle]
    paths:
      - 'ci/homebrew-fzf/**'
      - '.github/workflows/fzf-*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ fromJSON(vars.DOTFILES_LINUX_CI == 'self-hosted' && vars.DOTFILES_CI_REVIEWED_SHA != '' && github.sha == vars.DOTFILES_CI_REVIEWED_SHA && '["self-hosted", "linux", "x64", "dotfiles-reviewed"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          bash -n ci/homebrew-fzf/recipe.sh
          python3 -m unittest discover -s ci/homebrew-fzf/tests -v
          bash ci/homebrew-fzf/recipe.sh preflight
